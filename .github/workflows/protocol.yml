name: Protocol

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -j4 -- -D warnings
      - run: cargo test --workspace --locked -j4 -- --test-threads=4
      - run: cargo run --locked -p gui-use-protocol-codegen -- --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
